notes: >-
  I want this portfolio to feel personal, clean, and a little different from the typical student
  developer portfolio. I don't want it to feel overly polished, corporate, or like it came from a
  template. I want someone visiting the site to get a sense of who I am and what I’m interested in
  within the first few seconds.


  I’m studying accounting and computer science, with a math minor, so I like the combination of
  business, technology, data, and problem solving. I want the site to reflect that mix without
  making it feel like I’m trying too hard to explain it. I care more about showing what I’ve
  actually done and how I think than listing a huge number of technologies.


  Visually, I like minimal and modern designs, but I don't want something completely plain. Give it
  some personality through typography, spacing, subtle interactions, interesting layouts, and small
  details. I don't want excessive gradients, flashy animations, giant text everywhere, or the usual
  "developer portfolio" look.


  I want it to feel confident but not arrogant, technical but approachable, and professional without
  feeling corporate. Someone looking at it should feel like there is an actual person behind the
  site.


  For the content, keep things honest. Don't make unfinished ideas sound like completed projects,
  and don't exaggerate my experience. I'd rather have a few things presented really well than a page
  full of things that don't mean much.


  My long-term goal is to work where technology and business overlap, especially around data, AI,
  finance, accounting, and automation. I’m still figuring out exactly where that takes me, so I
  don't want the portfolio to make me look like I have my entire career mapped out. I want it to
  show that I'm curious, I like building things, and I'm interested in learning where those
  interests take me.


  Overall, make it feel like my own corner of the internet, not a résumé converted into a website.
